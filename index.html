<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animation of some perfect maps</title>

    <style>
      :root{
        --bg1:#0b1020;
        --bg2:#0f2a4a;
        --card: rgba(255,255,255,.06);
        --card-border: rgba(255,255,255,.12);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.68);
        --shadow: 0 16px 50px rgba(0,0,0,.35);
        --radius: 18px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body{
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(94,234,212,.25), transparent 60%),
          radial-gradient(900px 500px at 85% 20%, rgba(59,130,246,.28), transparent 55%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
      }

      .wrap{
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      header{
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1{
        margin: 0;
        font-size: clamp(20px, 2.8vw, 34px);
        letter-spacing: .2px;
        line-height: 1.1;
      }

      .subtitle{
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .grid{
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .card{
        position: relative;
        border-radius: var(--radius);
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .card .label{
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
      }

      .pill{
        pointer-events: none;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(0,0,0,.25);
        border: 1px solid rgba(255,255,255,.14);
        color: rgba(255,255,255,.9);
        font-size: 13px;
        letter-spacing: .2px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hint{
        color: rgba(255,255,255,.65);
        font-size: 12px;
      }

      .frame{
        width: 100%;
        height: 340px;
        border: 0;
        display: block;
        transform: translateZ(0);
      }

      @media (max-width: 520px){
        .frame{ height: 300px; }
        header{ align-items: flex-start; flex-direction: column; }
      }

      /* Optional: subtle hover */
      .card:hover{
        border-color: rgba(255,255,255,.2);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Animation of some perfect maps</h1>
        </div>
      </header>

      <section class="grid" aria-label="Perfect map previews">
        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (2,2,2,4,4)</div>
          </div>
          <iframe class="frame" src="./3D/PM_2_2x2_4x4.html" title="PM_2_2x2_4x4"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (2,2,3,8,8)</div>
          </div>
          <iframe class="frame" src="./3D/PM_2_2x3_8x8.html" title="PM_2_2x3_8x8"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (2,3,2,16,4)</div>
          </div>
          <iframe class="frame" src="./3D/PM_2_3x2_16x4.html" title="PM_2_3x2_16x4"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (2,3,3,16,32)</div>
          </div>
          <iframe class="frame" src="./3D/PM_2_3x3_16x32.html" title="PM_2_3x3_16x32"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (3,2,2,9,9)</div>
          </div>
          <iframe class="frame" src="./3D/PM_3_2x2_9x9.html" title="PM_3_2x2_9x9"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (4,2,2,16,16)</div>
          </div>
          <iframe class="frame" src="./3D/PM_4_2x2_16x16.html" title="PM_4_2x2_16x16"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (5,2,2,25,25)</div>
          </div>
          <iframe class="frame" src="./3D/PM_5_2x2_25x25.html" title="PM_5_2x2_25x25"></iframe>
        </div>

        <div class="card">
          <div class="label">
            <div class="pill">Perfect map (6,2,2,36,36)</div>
          </div>
          <iframe class="frame" src="./3D/PM_6_2x2_36x36.html" title="PM_6_2x2_36x36"></iframe>
        </div>
      </section>
    </div>
  </body>
</html>
